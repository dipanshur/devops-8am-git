--- 
- hosts: all
  become: yes
  vars:
    docker_secret_name: dockerhub-credentials
    docker_secret_json: "{{ lookup('pipe', 'aws secretsmanager get-secret-value --secret-id ' ~ docker_secret_name ~ ' --query SecretString --output text') }}"
    docker_creds: "{{ docker_secret_json | from_json }}"
    docker_username: "{{ docker_creds.docker_username | default(docker_creds.username) }}"
    docker_password: "{{ docker_creds.docker_password | default(docker_creds.password) }}"

  tasks: 
    - name: install docker
      yum: 
        name: docker
        state: present

    - name: start and enable docker service
      service: 
        name: docker
        state: started
        enabled: yes

    - name: add existing user abc to docker group
      user:
        name: abc
        groups: docker
        append: yes

    - name: login to Docker registry securely
      ansible.builtin.shell: |
        echo "{{ docker_password }}" | docker login --username "{{ docker_username }}" --password-stdin
      no_log: true

      