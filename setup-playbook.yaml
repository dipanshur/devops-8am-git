--- 
- plugin: aws_ec2
  hosts: all
  become: yes
  vars:
    docker_secret_name: dockerhub-credentials


  tasks: 
    - name: install docker
      yum: 
        name: docker
        state: present

      service: 
        name: docker
        state: started
        enabled: yes

    - name: add existing user abc to docker group
      user:
        name: abc
        groups: docker
        append: yes

    - name: fetch docker credentials from AWS Secrets Manager
      community.aws.aws_secret_info:
        name: "{{ docker_secret_name }}"
      register: docker_secret
      delegate_to: localhost
      run_once: true

    - name: set docker login variables from secret
      set_fact:
        docker_creds: "{{ docker_secret.secrets[0].SecretString | from_json }}"
        docker_username: "{{ docker_creds.username }}"
        docker_password: "{{ docker_creds.password }}"
      no_log: true

    - name: login to Docker registry securely
      docker_login:
        username: "{{ docker_username }}"
        password: "{{ docker_password }}"
      no_log: true

      